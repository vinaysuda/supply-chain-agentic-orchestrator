[project]
name = "supply-chain-agentic-orchestrator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "crewai>=1.14.4",
    "langchain-google-genai>=4.2.2",
    "langchain-openai>=1.2.1",
    "langgraph>=1.1.10",
    "langgraph-checkpoint-postgres>=3.0.5",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.12.5",
]

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "python-dotenv>=1.2.2",
    "ruff>=0.15.12",
]

[tool.ruff]
# Set the maximum line length to 120 (standard for modern, readable AI architectures)
line-length = 120
# Assume Python 3.14
target-version = "py314"

[tool.ruff.lint]
# Enable Pyflakes (F), pycodestyle (E, W), isort (I), and pyupgrade (UP)
select = ["E", "F", "W", "I", "UP"]
ignore = []

# Enforce strict formatting rules
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
# The ultimate strictness flags
strict = true
explicit_package_bases = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

# Ignore missing type stubs for dynamic AI libraries (like CrewAI if they haven't updated yet)
[[tool.mypy.overrides]]
module = [
    "crewai.*",
    "langchain_openai.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = [
  "."
]
